[package]
name = "wasting"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
rand = "0.10"
rand_distr = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["native-tls-vendored", "http2", "charset", "gzip", "brotli", "zstd", "deflate", "query", "stream"]